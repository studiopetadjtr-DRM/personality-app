name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run scoring tests
        run: node --test tests/scoring.test.js
      - name: Check HTML validity
        run: |
          echo "Checking index.html and landing.html exist"
          test -f index.html && test -f landing.html
